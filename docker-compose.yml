services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_dev_password
      POSTGRES_DB: brightloop
    ports:
      - "5432:5432"
    volumes:
      - brightloop_pg:/var/lib/postgresql/data
      - ./docs/sql/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  brightloop_pg:
